name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: garage-kit:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: End-to-end against the container (sign-in, cars, MCP OAuth, tools)
        run: |
          mkdir -p "$RUNNER_TEMP/data" && sudo chown 1000:1000 "$RUNNER_TEMP/data"
          docker run -d --name garage -p 127.0.0.1:8787:8787 -v "$RUNNER_TEMP/data:/data" \
            -e GARAGE_PASSWORD=ci-smoke-test -e AI_PROVIDER=mock garage-kit:ci
          for i in $(seq 1 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' garage)" = healthy ] && break
            curl -fsS http://127.0.0.1:8787/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/healthz
          docker exec garage node scripts/seed-demo.mjs
          GARAGE_PASSWORD=ci-smoke-test E2E_BASE=http://127.0.0.1:8787 node scripts/e2e-local.mjs
      - name: Container log
        if: always()
        run: docker logs garage 2>&1 | tail -50 || true
